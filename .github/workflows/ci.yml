# Intégration continue : chaque demande de fusion doit passer ces quatre travaux.
# Les actions tierces sont épinglées par empreinte de commit (et non par
# étiquette), pour qu'une étiquette déplacée ne puisse pas changer le code exécuté.
name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  verifications:
    name: Format, analyse et tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust épinglée (rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Analyse statique (clippy)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  windows:
    name: Tests sous Windows
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust épinglée (rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: KeePassXC 2.8.0 portable (interopérabilité sous Windows)
        shell: pwsh
        run: |
          # Archive officielle, vérifiée par son empreinte SHA-256 : la même que
          # celle du fichier KeePassXC-2.8.0-x64.zip.DIGEST publié avec la version.
          $archive = Join-Path $env:RUNNER_TEMP "KeePassXC-2.8.0-x64.zip"
          Invoke-WebRequest -Uri "https://github.com/keepassxreboot/keepassxc/releases/download/2.8.0/KeePassXC-2.8.0-x64.zip" -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "48ff4f088e9ce70e241da1270e5081528dba77c38b17dae4aa6690ffc50fc828") {
            throw "empreinte inattendue pour KeePassXC 2.8.0 : $hash"
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:RUNNER_TEMP "KeePassXC-2.8.0-x64")
      - name: Analyse statique du code propre à Windows (clippy)
        # Le travail Linux ne voit pas ce code (ligrivsstore-win, cfg(windows)) :
        # notamment les blocs unsafe et leurs justifications.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests, dont l'interopérabilité avec KeePassXC 2.8.0
        run: cargo test --workspace --locked
        env:
          LGS_REQUIRE_KEEPASSXC: "1"

  application-windows:
    name: Application Windows (interface et installateur)
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: apps/windows/package-lock.json
      - name: Chaîne Rust épinglée (rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: apps/windows/src-tauri
      - name: Dépendances de l'interface (versions figées)
        run: npm ci
      - name: Vulnérabilités connues (npm)
        # Paquets livrés : aucune vulnérabilité admise ; outils de
        # construction : rien de modéré ou de plus grave.
        run: |
          npm audit --omit=dev --audit-level=low
          npm audit --audit-level=moderate
      - name: Vérification de l'interface (svelte-check)
        run: npm run check
      - name: Construction de l'interface
        run: npm run build
      - name: Format et analyse de la coquille Tauri
        working-directory: apps/windows/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
      - name: Installateur NSIS (non signé au jalon 1)
        run: npm run tauri -- build --ci
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ligrivsstore-installateur-windows
          path: apps/windows/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  interoperabilite:
    name: KeePassXC et serveur « coffre » (banc Apache derrière un relais HTTPS)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Outils de test (KeePassXC, Apache, openssl, BusyBox)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends keepassxc apache2 apache2-utils curl openssl busybox
      - name: Chaîne Rust épinglée (rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Compilation
        run: cargo build --workspace --locked
      - name: Démarrage du banc WebDAV (configuration du serveur « coffre », relais HTTPS)
        run: sudo scripts/banc-webdav.sh demarrer
      - name: Tests du serveur « coffre » par le relais HTTPS
        run: sudo scripts/tests-serveur.sh
      - name: Interopérabilité KeePassXC et synchronisation réelle
        run: |
          set -a; . /tmp/lgs-banc-webdav/env; set +a
          LGS_REQUIRE_KEEPASSXC=1 LGS_REQUIRE_WEBDAV=1 \
            cargo test -p ligrivsstore-core --locked --test interop_keepassxc --test webdav
      - name: Deux postes synchronisés par le serveur (logique de l'application)
        run: |
          set -a; . /tmp/lgs-banc-webdav/env; set +a
          LGS_REQUIRE_WEBDAV=1 cargo test -p ligrivsstore-app --locked --test deux_postes
      - name: Scénario de recette de bout en bout
        run: |
          set -a; . /tmp/lgs-banc-webdav/env; set +a
          scripts/scenario-synchro.sh
      - name: Journaux du banc
        if: failure()
        run: sudo cat /tmp/lgs-banc-webdav/run/error.log /tmp/lgs-banc-webdav/run/relais-error.log /tmp/lgs-banc-webdav/run/access.log || true
      - name: Arrêt du banc
        if: always()
        run: sudo scripts/banc-webdav.sh arreter

  dependances:
    name: Licences et vulnérabilités connues (cargo-deny)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Chaîne Rust épinglée (rust-toolchain.toml)
        run: rustup toolchain install || rustup show
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Installation de cargo-deny
        run: cargo install --locked cargo-deny@0.20.2
      - name: Contrôle du dépôt
        run: cargo deny --log-level error check
      - name: Contrôle de l'application Windows (coquille Tauri, paquets de Windows)
        # Même politique (deny.toml) ; seuls comptent les paquets compilés
        # pour Windows, la cible de cette application.
        run: >-
          cargo deny --log-level error
          --manifest-path apps/windows/src-tauri/Cargo.toml
          --target x86_64-pc-windows-msvc
          --config deny.toml
          check
