# Propositions hebdomadaires de mises à jour. Chaque proposition passe par
# l'intégration continue et une relecture ; la bibliothèque KDBX (keepass),
# épinglée, n'est mise à jour qu'après lecture de son journal des changements.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Coquille Tauri de l'application Windows (espace de travail à part).
  - package-ecosystem: cargo
    directory: /apps/windows/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  # Interface et outils de construction de l'application Windows.
  - package-ecosystem: npm
    directory: /apps/windows
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # svelte-check 4.7 n'admet pas encore TypeScript 7 (dépendance pair
      # ^5 || ^6) : la demande n° 4 échouait à « npm ci » (décision 0010).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  # Outils de construction de l'extension (elle n'emporte aucune
  # dépendance). TypeScript suit la même version majeure que l'application.
  - package-ecosystem: npm
    directory: /extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
