# Contrôle des dépendances (cargo-deny) : licences compatibles avec un produit
# fermé et payant, vulnérabilités connues (base RustSec), origines autorisées.

[graph]
all-features = false

[advisories]
version = 2
# Toute vulnérabilité connue fait échouer l'intégration continue.
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
# Licences permissives seulement : aucune licence à réciprocité forte (GPL,
# LGPL, AGPL) n'est admise. La MPL-2.0, dont la réciprocité s'arrête aux
# fichiers du paquet lui-même, n'est admise que pour les paquets nommés dans
# « exceptions » ci-dessous (décision 0010).
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost Software License : clipboard-win et error-code (presse-papiers de
    # Windows), aussi permissive que MIT.
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # Dans l'application Windows, sans modification : son code source est
    # indiqué dans les mentions des logiciels tiers (dirs-sys → dirs → tauri).
    { allow = ["MPL-2.0"], crate = "option-ext" },
    # Outils de compilation seulement (tauri-utils → tauri-codegen →
    # tauri-macros, une macro procédurale) : absents du programme livré.
    { allow = ["MPL-2.0"], crate = "cssparser" },
    { allow = ["MPL-2.0"], crate = "cssparser-macros" },
    { allow = ["MPL-2.0"], crate = "dtoa-short" },
    { allow = ["MPL-2.0"], crate = "selectors" },
    # Licence BSD sans clause (0BSD), sans aucune condition : plus permissive
    # que MIT. Dépendances d'interprocess, le canal nommé entre le relais et
    # l'application (décision 0012) : recvmsg sous Windows ; doctest-file, une
    # macro de compilation, absente du programme livré.
    { allow = ["0BSD"], crate = "recvmsg" },
    { allow = ["0BSD"], crate = "doctest-file" },
]
# Nos propres paquets ne sont pas publiés.
private = { ignore = true }

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
