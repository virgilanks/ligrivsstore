[package]
name = "ligrivsstore-win"
description = "Intégration à Windows de l'application de bureau ligrivsstore : verrouillage de session, mise en veille, presse-papiers protégé"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file.workspace = true
publish.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true

# Seules dépendances propres à Windows. windows-sys est publié par Microsoft ;
# clipboard-win (licence BSL-1.0) est le presse-papiers qu'utilisent arboard et
# l'extension de presse-papiers de Tauri.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_RemoteDesktop",
    "Win32_UI_WindowsAndMessaging",
] }
clipboard-win = "5.4.3"

# Seul paquet du dépôt où le code `unsafe` est admis (décision 0011) : il est
# refusé partout, sauf dans le module `systeme_windows`, où chaque bloc ne
# contient qu'une opération, justifiée par un commentaire SAFETY.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
