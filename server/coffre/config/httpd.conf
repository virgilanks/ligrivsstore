# =============================================================================
# coffre — serveur de synchronisation WebDAV des coffres (format KDBX)
#
# Image officielle httpd:2.4.70-trixie. Ce fichier remplace la configuration
# par défaut : il est monté en lecture seule sur
# /usr/local/apache2/conf/httpd.conf.
#
# Le conteneur tourne directement en www-data (33:33), sans capacité, avec un
# système de fichiers en lecture seule.
#
# Aucun secret dans ce fichier : les comptes WebDAV (empreintes bcrypt) sont
# dans conf/auth/htpasswd, généré sur le serveur par scripts/utilisateurs.sh.
# Variables lues dans l'environnement (fichier .env) : PUBLIC_HOSTNAME, EDGE01_IP.
# =============================================================================

ServerRoot "/usr/local/apache2"
Listen 8080
# Les clients parlent en HTTPS (Cloudflare, puis Caddy en HTTP) : le schéma et le port
# déclarés ici rendent justes l'en-tête Location et le contrôle de l'en-tête Destination
# de MOVE et COPY (sinon : 502 « Destination URI refers to different scheme or port »).
ServerName https://${PUBLIC_HOSTNAME}:443
PidFile /tmp/httpd.pid
DefaultRuntimeDir /tmp

# --- Modules strictement nécessaires -------------------------------------------
LoadModule mpm_event_module   modules/mod_mpm_event.so
LoadModule authn_file_module  modules/mod_authn_file.so
LoadModule authn_core_module  modules/mod_authn_core.so
LoadModule authz_user_module  modules/mod_authz_user.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule auth_basic_module  modules/mod_auth_basic.so
LoadModule reqtimeout_module  modules/mod_reqtimeout.so
LoadModule mime_module        modules/mod_mime.so
LoadModule headers_module     modules/mod_headers.so
LoadModule remoteip_module    modules/mod_remoteip.so
LoadModule alias_module       modules/mod_alias.so
LoadModule dav_module         modules/mod_dav.so
LoadModule dav_fs_module      modules/mod_dav_fs.so
<IfModule !log_config_module>
    LoadModule log_config_module modules/mod_log_config.so
</IfModule>
<IfModule !unixd_module>
    LoadModule unixd_module   modules/mod_unixd.so
</IfModule>

# Utilisés seulement si le processus était lancé en root (Docker le lance en 33:33).
User www-data
Group www-data

# --- Durcissement ----------------------------------------------------------------
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size
AddDefaultCharset Off
Timeout 60
KeepAlive On
KeepAliveTimeout 5
MaxKeepAliveRequests 100
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
# 50 Mo par requête : un coffre pèse quelques Mo ; limite Cloudflare à 100 Mo.
LimitRequestBody 52428800
LimitXMLRequestBody 1000000
LimitRequestFields 50

<IfModule mpm_event_module>
    StartServers           1
    ServerLimit            2
    ThreadsPerChild        25
    MaxRequestWorkers      50
    MinSpareThreads        10
    MaxSpareThreads        50
    MaxConnectionsPerChild 10000
</IfModule>

# Adresse réelle du client, transmise par Caddy : edge01 est le seul relais de confiance.
RemoteIPHeader X-Forwarded-For
RemoteIPInternalProxy ${EDGE01_IP}

# --- Journaux sur la sortie standard, sans secret --------------------------------
ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%a %u [%{%Y-%m-%dT%H:%M:%S}t] \"%m %U %H\" %>s %B %D" coffre
CustomLog /proc/self/fd/1 coffre

TypesConfig conf/mime.types
AddType application/octet-stream .kdbx .kdb .key .keyx

# --- En-têtes : rien ne doit être mis en cache (Cloudflare, navigateur) ----------
Header always set Cache-Control "no-store"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "no-referrer"
Header always set Content-Security-Policy "default-src 'none'; frame-ancestors 'none'"

# --- Par défaut, tout est refusé ---------------------------------------------------
<Directory />
    Options None
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    Options None
    AllowOverride None
    Require all denied
    <Files "healthz.txt">
        Require all granted
    </Files>
</Directory>

# --- Santé : réponse « ok », publique, sans authentification (Gatus) -------------
Alias /healthz /usr/local/apache2/htdocs/healthz.txt
<Location "/healthz">
    ForceType text/plain
</Location>

# --- WebDAV --------------------------------------------------------------------------
DavLockDB "/var/lib/davlock/DavLock"
DavDepthInfinity Off

# Coffres : /dav/<utilisateur>/ en lecture et écriture, pour son seul propriétaire.
Alias /dav "/srv/keepass/dav"
<Directory "/srv/keepass/dav">
    Dav On
    Options None
    AllowOverride None
    AuthType Basic
    AuthName "coffre"
    AuthBasicProvider file
    AuthUserFile "/usr/local/apache2/conf/auth/htpasswd"
    # La racine, qui révélerait la liste des utilisateurs, n'est ouverte à personne ;
    # un dossier sans bloc d'utilisateur non plus.
    Require all denied
</Directory>

# Historique : /versions/<utilisateur>/ en lecture seule (volume monté en :ro),
# alimenté par le conteneur « versions ».
Alias /versions "/srv/keepass/versions"
<Directory "/srv/keepass/versions">
    Dav On
    Options None
    AllowOverride None
    AuthType Basic
    AuthName "coffre"
    AuthBasicProvider file
    AuthUserFile "/usr/local/apache2/conf/auth/htpasswd"
    Require all denied
</Directory>

# Un bloc <Directory> explicite par utilisateur, généré par scripts/utilisateurs.sh.
# Ne pas remplacer par un <DirectoryMatch> générique : avec une même section pour
# tous, Apache ne revérifie pas les droits sur la destination d'un MOVE ou d'un
# COPY, et un utilisateur pourrait déposer un fichier chez un autre (vérifié en test).
IncludeOptional conf/utilisateurs/*.conf
